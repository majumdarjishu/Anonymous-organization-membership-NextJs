name: Anonymous Organization - Midnight dApp CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── Job 1: Lint & Type-check the root TypeScript project ───────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: TypeScript type check (no-emit)
        run: npm run build

      - name: Run unit test suite
        run: npm test

  # ─── Job 2: Build the React UI ───────────────────────────────────────────────
  build-ui:
    name: Build React UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install UI dependencies
        working-directory: ui
        run: npm install

      - name: Build Vite/React production bundle
        working-directory: ui
        run: npm run build

      - name: Upload UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  # ─── Job 3: Validate contract source exists & is well-formed ────────────────
  validate-contract:
    name: Validate Contract Source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check contract file exists
        run: |
          CONTRACT="contracts/anonymous-organization-membership.compact"
          if [ ! -f "$CONTRACT" ]; then
            echo "❌ Contract file missing: $CONTRACT"
            exit 1
          fi
          echo "✅ Contract file found: $CONTRACT"
          wc -l "$CONTRACT"

      - name: Validate contract has required circuits
        run: |
          CONTRACT="contracts/anonymous-organization-membership.compact"
          echo "--- Checking for required circuit definitions ---"
          grep -n "circuit\|ledger\|export" "$CONTRACT" || true
          
          if grep -q "joinOrganization\|addToAllowlist\|allowlist\|memberCount" "$CONTRACT"; then
            echo "✅ Contract contains required membership logic"
          else
            echo "⚠️  Contract may be missing expected circuit identifiers"
          fi

      - name: Contract compile step (requires local Midnight toolchain)
        run: |
          echo "ℹ️  The Compact compiler (compact CLI) must be installed via the official"
          echo "   Midnight installer script, not via npm:"
          echo ""
          echo "   curl --proto '=https' --tlsv1.2 -LsSf \\"
          echo "     https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh"
          echo "   compact update"
          echo ""
          echo "✅ Contract validation complete. Full compilation requires local Midnight devnet."

  # ─── Job 4: Security audit ───────────────────────────────────────────────────
  security-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Audit root dependencies (high severity only)
        run: npm audit --audit-level=critical || true

      - name: Install UI dependencies
        working-directory: ui
        run: npm install

      - name: Audit UI dependencies (critical severity only)
        working-directory: ui
        run: npm audit --audit-level=critical || true
